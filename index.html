<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLifant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

        :root {
            --bg-blue: #B4E4FF;
            --text-gray: #4A4A4A;
            --accent-pink: #FFB5E8;
            --accent-yellow: rgba(255, 255, 224, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-blue);
            font-family: 'Comic Neue', cursive;
            color: var(--text-gray);
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: url('cursor.png'), auto;
            animation: rainbow-bg-body 5s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes rainbow-bg {
            0% { background: var(--accent-pink); }
            25% { background: #98FF98; } /* Light green */
            50% { background: var(--bg-blue); }
            75% { background: #FFB5E8; } /* Pink */
            100% { background: var(--accent-pink); }
        }

        @keyframes rainbow-bg-body {
            0% { background: var(--accent-pink); }
            25% { background: #98FF98; }
            50% { background: var(--bg-blue); }
            75% { background: #FFB5E8; }
            100% { background: var(--accent-pink); }
        }

        @keyframes rainbow-bg-container {
            0% { background: #98FF98; }  /* Light green when others are pink */
            33% { background: #FFB5E8; } /* Light pink when others are green */
            66% { background: #B4E4FF; } /* Light blue when others are pink */
            100% { background: #98FF98; } /* Back to green */
        }

        @keyframes letter-rainbow {
            0% { color: #FF6B6B; }  /* Vibrant coral red */
            25% { color: #4ECDC4; } /* Bright turquoise */
            50% { color: #FFD93D; } /* Bright yellow */
            75% { color: #FF8FD2; } /* Bright pink */
            100% { color: #FF6B6B; }
        }

        .rainbow-text {
            display: inline-block;
        }

        .rainbow-letter {
            display: inline-block;
            animation: none; /* Remove default animation */
            color: var(--text-gray);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .page-container {
            width: min(85vw, 800px);
            height: min(85vh, 700px);
            background: white;
            border-radius: clamp(20px, 4vw, 40px);
            border: 2px solid var(--text-gray);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
            overflow: visible;
            display: flex;
            flex-direction: column;
            padding: clamp(10px, 2vw, 20px);
            position: relative;
            transition: transform 0.3s ease;
            margin: auto;
            justify-content: space-between;
            animation: rainbow-bg-container 5s linear infinite;
        }

        .page-container:hover {
            transform: scale(1.01);
        }

        .logo-container {
            width: clamp(80px, 12vw, 120px);
            height: clamp(80px, 12vw, 120px);
            margin: clamp(5px, 1vh, 10px) auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            position: relative;
        }

        .logo-container:hover {
            animation: wiggle 1s ease-in-out infinite;
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            transition: transform 0.3s ease;
        }

        .title-container {
            margin: 10px 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        h1 {
            font-size: clamp(24px, 4vw, 36px);
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.3s ease;
            line-height: 1.2;
        }

        h1:hover {
            animation: bounce 0.5s ease infinite;
        }

        .tagline {
            font-size: clamp(14px, 2.5vw, 20px);
            margin: 0;
            font-style: italic;
            letter-spacing: 0.5px;
            transition: transform 0.3s ease;
            line-height: 1.3;
        }

        .tagline:hover {
            transform: scale(1.05);
        }

        .ticker {
            font-family: 'Courier New', monospace;
            color: var(--text-gray);
            font-size: clamp(14px, 2vw, 18px);
            margin: 15px auto;
            letter-spacing: 1px;
            background: var(--accent-pink);
            padding: clamp(10px, 1.5vw, 20px) clamp(15px, 3vw, 40px);
            border-radius: 20px;
            display: inline-block;
            border: 2px solid var(--text-gray);
            transition: all 0.3s ease;
            animation: rainbow-bg 5s linear infinite;
            position: relative;
            overflow: hidden;
            min-height: clamp(40px, 6vh, 80px);
            width: clamp(180px, 50%, 400px);
            z-index: 1;
        }

        .ticker.expanded {
            overflow: visible;
        }

        .ticker:hover {
            transform: scale(1.05);
            animation: rainbow-bg 1s infinite;
        }

        .floating-lol {
            position: absolute;
            font-size: clamp(10px, 1.5vw, 14px);
            white-space: nowrap;
            animation: float-around-contained 10s linear infinite;
            opacity: 0.9;
            font-weight: bold;
            transform-origin: center;
            transition: none; /* Remove transition to prevent synchronized movement */
            will-change: transform, opacity;
            pointer-events: none;
            left: 50%;
            top: 50%;
        }

        @keyframes float-around-contained {
            0% {
                transform: translate(var(--x1), var(--y1)) rotate(var(--r1)) scale(var(--s1));
                opacity: var(--o1);
            }
            20% {
                transform: translate(var(--x2), var(--y2)) rotate(var(--r2)) scale(var(--s2));
                opacity: var(--o2);
            }
            40% {
                transform: translate(var(--x3), var(--y3)) rotate(var(--r3)) scale(var(--s3));
                opacity: var(--o3);
            }
            60% {
                transform: translate(var(--x4), var(--y4)) rotate(var(--r4)) scale(var(--s4));
                opacity: var(--o4);
            }
            80% {
                transform: translate(var(--x5), var(--y5)) rotate(var(--r5)) scale(var(--s5));
                opacity: var(--o5);
            }
            100% {
                transform: translate(var(--x1), var(--y1)) rotate(var(--r1)) scale(var(--s1));
                opacity: var(--o1);
            }
        }

        @keyframes float-around-expanded {
            0% {
                transform: translate(var(--ex1), var(--ey1)) rotate(var(--er1)) scale(var(--es1));
                opacity: var(--eo1);
            }
            25% {
                transform: translate(var(--ex2), var(--ey2)) rotate(var(--er2)) scale(var(--es2));
                opacity: var(--eo2);
            }
            50% {
                transform: translate(var(--ex3), var(--ey3)) rotate(var(--er3)) scale(var(--es3));
                opacity: var(--eo3);
            }
            75% {
                transform: translate(var(--ex4), var(--ey4)) rotate(var(--er4)) scale(var(--es4));
                opacity: var(--eo4);
            }
            100% {
                transform: translate(var(--ex1), var(--ey1)) rotate(var(--er1)) scale(var(--es1));
                opacity: var(--eo1);
            }
        }

        .ticker.expanded .floating-lol,
        .social-button.expanded .floating-lol {
            animation: float-around-expanded 12s linear infinite;
            z-index: 9999;
            position: fixed;
            left: 50vw;
            top: 50vh;
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 15px;
            margin: 10px 0;
            border-radius: clamp(20px, 4vw, 40px);
            padding: clamp(15px, 2vw, 25px);
            position: relative;
            overflow: hidden;
        }

        .content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: clamp(20px, 4vw, 40px);
            border: 2px dashed transparent;
            background: linear-gradient(90deg, 
                #FF6B6B 0%, 
                #4ECDC4 20%, 
                #FFD93D 40%, 
                #FF8FD2 60%, 
                #98FF98 80%, 
                #FF6B6B 100%
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) padding-box, 
                linear-gradient(#fff 0 0);
            mask: 
                linear-gradient(#fff 0 0) padding-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes rotate-border {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: clamp(20px, 3vw, 40px);
            margin: 5px 0;
        }

        .social-button {
            background: var(--accent-pink);
            color: var(--text-gray);
            padding: clamp(6px, 1vw, 12px) clamp(15px, 2vw, 30px);
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: clamp(14px, 1.8vw, 16px);
            border: 2px solid var(--text-gray);
            min-width: clamp(80px, 12vw, 120px);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: rainbow-bg 5s linear infinite;
            z-index: 2;
        }

        .social-button span {
            position: relative;
            z-index: 3;
            display: inline-block;
        }

        .social-button .floating-lol {
            font-size: clamp(8px, 1.2vw, 12px);
            animation-duration: 6s;
            z-index: 1;
        }

        .social-button:active {
            animation: pop 0.3s ease;
        }

        .stats {
            padding: 10px;
            margin: 5px auto;
            width: 70%;
            transition: transform 0.3s ease;
        }

        .stats:hover {
            transform: scale(1.02);
        }

        .stats h3 {
            color: var(--text-gray);
            margin: 0 0 5px 0;
            font-size: clamp(16px, 2.5vw, 20px);
            letter-spacing: 0.5px;
        }

        .stats p {
            font-size: clamp(14px, 2vw, 18px);
            color: var(--text-gray);
            margin: 0;
            font-weight: bold;
        }

        .url-code {
            font-family: 'Courier New', monospace;
            color: var(--text-gray);
            padding: 10px 20px;
            margin: 10px auto;
            font-size: clamp(12px, 1.5vw, 14px);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .url-code:hover {
            transform: scale(1.05);
            color: var(--bg-blue);
        }

        /* Custom cursor trail effect */
        .cursor-trail {
            pointer-events: none;
            position: fixed;
            width: 20px;
            height: 20px;
            z-index: 9999;
            transition: opacity 0.5s ease;
            opacity: 0.8;
            transform-origin: center;
        }

        @keyframes vibrate {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(-2px, -2px); }
        }

        @keyframes swirl {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        @keyframes spiral {
            0% { transform: rotate(0deg) translateX(0) translateY(0); }
            100% { transform: rotate(360deg) translateX(10px) translateY(10px); }
        }

        @keyframes elephant-dance {
            0% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .shape-star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: swirl 1s linear infinite;
        }

        .shape-heart {
            clip-path: path('M12 4.248c-3.148-5.402-12-3.825-12 2.944 0 4.661 5.571 9.427 12 15.808 6.43-6.381 12-11.147 12-15.808 0-6.792-8.875-8.306-12-2.944z');
            animation: pulse 1s ease infinite;
        }

        .shape-flower {
            clip-path: polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%);
            animation: spiral 1s linear infinite;
        }

        .shape-elephant {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: transparent !important;
        }

        .shape-elephant::before {
            content: '𓃰';
            animation: elephant-dance 0.5s linear infinite;
            display: inline-block;
        }

        /* Click effect styles */
        .click-effect {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: click-expand 0.5s ease-out forwards;
        }

        @keyframes click-expand {
            0% {
                width: 20px;
                height: 20px;
                opacity: 0.8;
                border: 2px solid var(--bg-blue);
            }
            100% {
                width: 40px;
                height: 40px;
                opacity: 0;
                border: 2px solid var(--accent-pink);
            }
        }

        .speech-bubble {
            position: absolute;
            background: white;
            border: 2px solid var(--text-gray);
            border-radius: 15px;
            padding: 10px 15px;
            top: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            transform-origin: bottom;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 0.5s ease;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
            z-index: 1000;
            min-width: 60px;
            animation: rainbow-bg 5s linear infinite;
            opacity: 0;
            visibility: visible;
            pointer-events: none;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--text-gray);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
            z-index: 1;
        }

        .speech-bubble.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .speech-bubble span {
            font-family: 'Comic Neue', cursive;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
        }

        .speech-bubble span.rainbow-letter {
            animation: letter-rainbow 2s infinite;
        }

        .hover-text {
            position: absolute;
            left: 120%;
            top: 50%;
            transform: translateY(-50%) scale(0);
            opacity: 0;
            transition: all 0.3s ease;
            font-family: 'Comic Neue', cursive;
            font-size: clamp(16px, 2vw, 20px);
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }

        .hover-text.left-side {
            left: auto;
            right: 120%;
        }

        .hover-text span {
            display: inline-block;
            animation: letter-rainbow 2s infinite;
        }

        .logo-container:hover .hover-text {
            transform: translateY(-50%) scale(1);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="logo-container">
            <img src="logo.png" alt="LOLifant Logo" class="logo">
            <div class="hover-text"></div>
        </div>
        <div class="title-container">
            <h1 class="rainbow-text"></h1>
            <p class="tagline rainbow-text"></p>
        </div>
        <div class="ticker" id="ticker"></div>
        
        <div class="content">
            <div class="social-links">
                <a href="https://www.x.com/lolifantbtc" target="_blank" class="social-button">Twitter</a>
                <a href="https://odin.fun/token/2bn2" target="_blank" class="social-button">Odin.Fun</a>
            </div>

            <div class="stats">
                <h3>Total Supply</h3>
                <p>1,000,000,000 $LOL</p>
            </div>

            <div class="url-code">
                Correct URL Code: '2bn2'
            </div>
        </div>
    </div>

    <script>
        function setupRainbowText() {
            const title = "LOLifant";
            const tagline = "An elephant that laughs out loud, LOL!";
            const titleElement = document.querySelector('h1.rainbow-text');
            const taglineElement = document.querySelector('p.rainbow-text');

            const colors = [
                '#FF6B6B',  // Vibrant coral red
                '#4ECDC4',  // Bright turquoise
                '#FFD93D',  // Bright yellow
                '#FF8FD2',  // Bright pink
                '#98FF98',  // Light green
                '#B4E4FF',  // Light blue
                '#FFB5E8'   // Pink
            ];

            function getDistinctColor(index, usedColors) {
                // Get colors used by nearby letters (within 2 positions)
                const nearbyColors = new Set();
                for (let i = Math.max(0, index - 2); i <= index + 2; i++) {
                    if (usedColors[i]) nearbyColors.add(usedColors[i]);
                }
                
                // Filter available colors
                const availableColors = colors.filter(color => !nearbyColors.has(color));
                return availableColors[Math.floor(Math.random() * availableColors.length)];
            }

            function createRainbowText(text, element) {
                const usedColors = {};
                const spans = [];

                // First pass: create spans and assign initial colors
                text.split('').forEach((char, i) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    if (char !== ' ') {
                        span.className = 'rainbow-letter';
                        const color = getDistinctColor(i, usedColors);
                        usedColors[i] = color;
                        span.style.color = color;
                        
                        // Set up different animation durations
                        const duration = 4 + (i % 3);
                        span.style.animation = `letter-rainbow ${duration}s infinite`;
                        // Stagger the animation starts
                        span.style.animationDelay = `-${(i * 0.7) % duration}s`;
                    } else {
                        span.innerHTML = '&nbsp;';
                    }
                    spans.push(span);
                    element.appendChild(span);
                });
            }

            createRainbowText(title, titleElement);
            createRainbowText(tagline, taglineElement);
        }

        function setupFloatingLOLs() {
            const ticker = document.getElementById('ticker');
            const socialButtons = document.querySelectorAll('.social-button');
            
            const colors = [
                '#FF6B6B',  // Vibrant coral red
                '#4ECDC4',  // Bright turquoise
                '#FFD93D',  // Bright yellow
                '#FF8FD2',  // Bright pink
                '#98FF98',  // Light green
                '#B4E4FF',  // Light blue
                '#FFB5E8'   // Pink
            ];

            function getRandomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            function getRandomRotation() {
                return getRandomInRange(-180, 180);
            }

            function createFloatingLOLs(container, count) {
                const containerRect = container.getBoundingClientRect();
                const isButton = container.classList.contains('social-button');
                const lols = [];
                
                // Adjusted reduction for expanded state visibility
                const actualCount = isButton ? Math.floor(count * 0.8) : Math.floor(count * 0.85);
                
                for (let i = 0; i < actualCount; i++) {
                    const lol = document.createElement('div');
                    lol.className = 'floating-lol';
                    lol.textContent = '$LOL';
                    
                    // Initial random position with better spread
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * (isButton ? containerRect.width * 0.8 : containerRect.width * 0.4);
                    lol.style.transform = `translate(${Math.cos(angle) * radius}px, ${Math.sin(angle) * radius}px) rotate(${Math.random() * 360}deg)`;
                    
                    // Base size multiplier logic
                    const sizeMultiplier = isButton ? 
                        (Math.random() < 0.3 ? getRandomInRange(1.2, 1.8) : 1) : 
                        (Math.random() < 0.2 ? getRandomInRange(1.1, 1.5) : 1);
                    
                    if (isButton) {
                        lol.style.fontSize = `clamp(8px, 1.2vw, 12px)`;
                    } else {
                        lol.style.fontSize = `calc(${sizeMultiplier} * clamp(12px, 2vw, 18px))`;
                    }
                    
                    lols.push(lol);
                    container.appendChild(lol);
                }

                function generateNewPositions(isExpanded = false) {
                    lols.forEach(lol => {
                        if (isExpanded) {
                            // Expanded state with much larger spread and better distribution
                            const expandedWidth = window.innerWidth * 5;
                            const expandedHeight = window.innerHeight * 5;
                            
                            // Different speed distribution for expanded state
                            const expandedSpeedMultiplier = Math.random() < 0.2 ? 
                                getRandomInRange(0.8, 1.2) :      // Moderately fast (20% chance)
                                Math.random() < 0.5 ?
                                    getRandomInRange(1.4, 2.2) :  // Medium (30% chance)
                                    getRandomInRange(2.5, 4.0);   // Slow (50% chance)
                            
                            // Much longer base duration for expanded state
                            const expandedBaseDuration = getRandomInRange(15, 30) * expandedSpeedMultiplier;
                            lol.style.animationDuration = `${expandedBaseDuration}s`;
                            
                            for (let i = 1; i <= 5; i++) {
                                // Random positions across the full container width and height
                                const x = getRandomInRange(-expandedWidth/2, expandedWidth/2);
                                const y = getRandomInRange(-expandedHeight/2, expandedHeight/2);
                                
                                // Much more varied sizes for expanded state
                                const expandedSize = Math.random() < 0.3 ?
                                    getRandomInRange(0.5, 1.0) :     // Small (30% chance)
                                    Math.random() < 0.6 ?
                                        getRandomInRange(1.5, 3.0) : // Medium (30% chance)
                                        getRandomInRange(3.5, 6.0);  // Large (40% chance)
                                
                                lol.style.setProperty(`--ex${i}`, `${x}px`);
                                lol.style.setProperty(`--ey${i}`, `${y}px`);
                                lol.style.setProperty(`--er${i}`, `${getRandomRotation() * 3}deg`);
                                lol.style.setProperty(`--es${i}`, expandedSize);
                                lol.style.setProperty(`--eo${i}`, getRandomInRange(0.4, 1));
                            }
                        } else {
                            // Free floating state using full container dimensions
                            const width = containerRect.width;
                            const height = containerRect.height;
                            
                            // Generate random positions across the full container
                            for (let i = 1; i <= 5; i++) {
                                // Random positions across the full container width and height
                                const x = getRandomInRange(-width/2, width/2);
                                const y = getRandomInRange(-height/2, height/2);
                                
                                // Regular animation speeds for non-expanded state
                                const speedMultiplier = Math.random() < 0.3 ? 
                                    getRandomInRange(0.4, 0.7) :  // Fast
                                    Math.random() < 0.6 ? 
                                        getRandomInRange(0.8, 1.4) :  // Medium-fast
                                        getRandomInRange(1.5, 2.5);   // Slow
                                
                                const baseDuration = isButton ? 
                                    getRandomInRange(8, 15) * speedMultiplier :
                                    getRandomInRange(10, 18) * speedMultiplier;
                                
                                lol.style.setProperty(`--x${i}`, `${x}px`);
                                lol.style.setProperty(`--y${i}`, `${y}px`);
                                lol.style.setProperty(`--r${i}`, `${getRandomRotation() * 1.5}deg`);
                                lol.style.setProperty(`--s${i}`, getRandomInRange(0.5, 2.5));
                                lol.style.setProperty(`--o${i}`, getRandomInRange(0.6, 1));
                            }
                        }
                        
                        lol.style.animationDelay = `${Math.random() * -(isExpanded ? 30 : 15)}s`;
                        lol.style.color = colors[Math.floor(Math.random() * colors.length)];
                    });
                }

                // Initial setup
                generateNewPositions();
                return generateNewPositions;
            }

            // Store update functions for each container
            const updateFunctions = new Map();
            
            // Create LOLs and store their update functions
            updateFunctions.set(ticker, createFloatingLOLs(ticker, 192)); // Reduced by 40% from 320
            socialButtons.forEach(button => {
                const buttonText = button.textContent;
                button.innerHTML = `<span>${buttonText}</span>`;
                updateFunctions.set(button, createFloatingLOLs(button, 96)); // Reduced by 40% from 160
            });

            // Function to expand/collapse all LOLs
            function toggleAllLOLs(expand) {
                if (expand) {
                    ticker.classList.add('expanded');
                    socialButtons.forEach(btn => btn.classList.add('expanded'));
                    // Generate new random positions for expanded state
                    updateFunctions.forEach(updateFn => updateFn(true));
                } else {
                    ticker.classList.remove('expanded');
                    socialButtons.forEach(btn => btn.classList.remove('expanded'));
                    // Generate new random positions for contained state
                    updateFunctions.forEach(updateFn => updateFn(false));
                }
            }

            // Add event listeners
            [ticker, ...socialButtons].forEach(element => {
                element.addEventListener('mouseenter', () => toggleAllLOLs(true));
                element.addEventListener('mouseleave', () => toggleAllLOLs(false));
            });
        }

        function setupLogoInteractions() {
            // Make logo interactive
            const logo = document.querySelector('.logo-container');
            
            // Create hover text with rainbow letters
            const hoverText = logo.querySelector('.hover-text');
            const hoverMessage = 'Click me LOL';
            let isTextOnLeft = false;
            let bubbleScale = 1;
            
            hoverMessage.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.style.animationDelay = `${index * 0.1}s`;
                hoverText.appendChild(span);
            });

            // Toggle text position immediately on hover and unhover
            logo.addEventListener('mouseenter', () => {
                hoverText.classList.toggle('left-side', isTextOnLeft);
            });

            logo.addEventListener('mouseleave', () => {
                isTextOnLeft = !isTextOnLeft;
                hoverText.classList.remove('show');
            });
            
            // Create speech bubble
            const speechBubble = document.createElement('div');
            speechBubble.className = 'speech-bubble';
            const lolText = 'LOL!';
            let clickTimeout;
            
            // Create rainbow letters for LOL!
            lolText.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'rainbow-letter';
                span.style.animationDelay = `${index * 0.1}s`;
                speechBubble.appendChild(span);
            });
            
            logo.appendChild(speechBubble);
            
            logo.addEventListener('click', function() {
                // Clear any existing timeout
                if (clickTimeout) {
                    clearTimeout(clickTimeout);
                }
                
                // Pop animation for the logo
                this.style.animation = 'none';
                this.offsetHeight; // Trigger reflow
                this.style.animation = 'pop 0.5s ease';
                
                // Increment bubble scale
                bubbleScale *= 1.01;
                
                // Reset any ongoing transitions
                speechBubble.style.transition = 'none';
                speechBubble.offsetHeight; // Force reflow
                speechBubble.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease';
                
                // Show speech bubble with current scale
                speechBubble.style.transform = `translateX(-50%) scale(${bubbleScale})`;
                speechBubble.style.opacity = '1';
                speechBubble.classList.add('show');
                
                // Hide speech bubble after 1 second
                clickTimeout = setTimeout(() => {
                    speechBubble.style.opacity = '0';
                    speechBubble.style.transform = `translateX(-50%) scale(${bubbleScale * 0.8})`;
                    
                    // Reset for next appearance after fade completes
                    setTimeout(() => {
                        speechBubble.classList.remove('show');
                        speechBubble.style.transform = 'translateX(-50%) scale(0)';
                    }, 500);
                    
                    // Return to floating animation
                    this.style.animation = 'float 3s ease-in-out infinite';
                }, 1000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupRainbowText();
            setupFloatingLOLs();
            setupLogoInteractions();
        });

        const colors = [
            '#FF0000', // red
            '#3783FF', // blue
            '#FFEE00', // yellow
            '#4DE94C', // green
            '#8A2BE2', // purple
            '#FF8E00', // orange
            '#FFB5E8', // pink
            '#B4E4FF', // light blue
            '#98FF98', // light green
            '#FFFACD', // light yellow
            '#FFD700'  // yellow
        ];

        const shapes = ['shape-star', 'shape-heart', 'shape-flower', 'shape-elephant'];
        let trailCount = 0;

        document.addEventListener('mousemove', function(e) {
            // Create trail more frequently for closer spacing
            if (trailCount % 1 === 0) {
                const trail = document.createElement('div');
                const shapeClass = shapes[trailCount % shapes.length];
                trail.className = `cursor-trail ${shapeClass}`;
                
                // Position with smaller offset for closer spacing
                trail.style.left = (e.pageX - 8) + 'px';
                trail.style.top = (e.pageY - 8) + 'px';
                
                // Set color based on position in sequence, but not for elephant
                if (shapeClass !== 'shape-elephant') {
                    const colorIndex = Math.floor(trailCount) % colors.length;
                    trail.style.background = colors[colorIndex];
                }
                
                document.body.appendChild(trail);

                // Fade out and remove more quickly
                setTimeout(() => {
                    trail.style.opacity = '0';
                    setTimeout(() => {
                        document.body.removeChild(trail);
                    }, 300);
                }, 300);
            }
            trailCount++;
        });

        // Add click effect
        document.addEventListener('click', function(e) {
            const clickEffect = document.createElement('div');
            clickEffect.className = 'click-effect';
            clickEffect.style.left = (e.pageX - 10) + 'px';
            clickEffect.style.top = (e.pageY - 10) + 'px';
            document.body.appendChild(clickEffect);

            setTimeout(() => {
                document.body.removeChild(clickEffect);
            }, 500);
        });
    </script>
</body>

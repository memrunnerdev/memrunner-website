<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNNER - Mempool Runner</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="main-container">
        <nav class="navbar">
            <div class="nav-content">
                <div class="nav-logo">$RUNNER</div>
            </div>
        </nav>

        <div class="content-area">
            <section id="hero" class="section hero active">
                <div class="hero-content">
                    <h1 class="hero-title">
                        <span>MEMPOOL</span>
                        <span>RUNNER</span>
                    </h1>
                    <p class="tagline">Race through the blockchain with the fastest memecoin in DeFi</p>
                    <div class="hero-buttons">
                        <a href="https://odin.fun" target="_blank" class="cta-button">Odin.Fun</a>
                        <a href="https://x.com/mempoolrunner" target="_blank" class="cta-button">X</a>
                    </div>
                </div>
                <img src="logo.png" alt="Mempool Runner Mascot" class="hero-mascot">
            </section>
        </div>
        
        <!-- Audio controls -->
        <div class="audio-controls">
            <button id="audioToggle"><i class="fas fa-volume-mute"></i></button>
        </div>
    </div>

    <!-- Audio element - not autoplaying by default -->
    <audio id="backgroundAudio" loop>
        <source src="sonic-theme.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backgroundAudio = document.getElementById('backgroundAudio');
            const audioToggle = document.getElementById('audioToggle');
            
            // Set initial volume
            backgroundAudio.volume = 0.7;
            
            // Audio is muted by default
            backgroundAudio.muted = true;
            
            // Audio toggle functionality - off by default, turns on when clicked
            audioToggle.addEventListener('click', function() {
                const icon = audioToggle.querySelector('i');
                
                if (icon.classList.contains('fa-volume-mute')) {
                    // Unmute and play the audio
                    backgroundAudio.muted = false;
                    backgroundAudio.play();
                    icon.classList.remove('fa-volume-mute');
                    icon.classList.add('fa-volume-up');
                } else {
                    // Pause the audio
                    backgroundAudio.pause();
                    icon.classList.remove('fa-volume-up');
                    icon.classList.add('fa-volume-mute');
                }
            });
        });
    </script>
</body>
</html>

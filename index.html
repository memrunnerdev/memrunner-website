<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNNER - Mempool Runner</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="main-container">
        <nav class="navbar">
            <div class="nav-content">
                <div class="nav-logo">$RUNNER</div>
            </div>
        </nav>

        <div class="content-area">
            <section id="hero" class="section hero active">
                <img src="logo.png" alt="Rocket Rabbit Logo" class="logo">
                <div class="hero-content">
                    <h1 class="hero-title">
                        <span>MEMPOOL</span>
                        <span>RUNNER</span>
                    </h1>
                    <p class="tagline">Race through the blockchain with the fastest memecoin in DeFi</p>
                    <div class="hero-buttons">
                        <a href="https://odin.fun" target="_blank" class="cta-button">Odin.Fun</a>
                        <a href="https://x.com/mempoolrunner" target="_blank" class="cta-button">X</a>
                    </div>
                </div>
            </section>
        </div>
        
        <!-- Audio controls -->
        <div class="audio-controls">
            <button id="audioToggle"><i class="fas fa-volume-mute"></i></button>
        </div>
    </div>

    <!-- Hidden YouTube iframe for audio -->
    <div id="youtubePlayer" style="position: absolute; left: -9999px; top: -9999px;">
        <iframe id="ytplayer" width="1" height="1" src="https://www.youtube.com/embed/eFZCYrTT9PA?enablejsapi=1" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audioToggle = document.getElementById('audioToggle');
            let player;
            let isPlaying = false;
            
            // YouTube API
            window.onYouTubeIframeAPIReady = function() {
                player = new YT.Player('ytplayer', {
                    events: {
                        'onReady': onPlayerReady
                    }
                });
            }
            
            function onPlayerReady(event) {
                // Player is ready
                player.setVolume(70); // Set volume to 70%
            }
            
            // Load YouTube API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            
            // Audio toggle functionality
            audioToggle.addEventListener('click', function() {
                const icon = audioToggle.querySelector('i');
                
                if (!isPlaying) {
                    // Play music
                    if (player && player.playVideo) {
                        player.playVideo();
                    }
                    isPlaying = true;
                    icon.classList.remove('fa-volume-mute');
                    icon.classList.add('fa-volume-up');
                } else {
                    // Pause music
                    if (player && player.pauseVideo) {
                        player.pauseVideo();
                    }
                    isPlaying = false;
                    icon.classList.remove('fa-volume-up');
                    icon.classList.add('fa-volume-mute');
                }
            });
        });
    </script>
</body>
</html>
